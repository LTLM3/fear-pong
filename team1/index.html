<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>FEAR PONG — TEAM 1</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}main{width:min(100%,540px);margin:auto;padding:35px 20px 50px;text-align:center}h1{font-size:clamp(48px,12vw,75px);font-weight:900;font-style:italic;letter-spacing:-3px;color:#ff641c;line-height:1;margin:0 0 12px}h2{font-size:17px;letter-spacing:4px;margin:0 0 25px}.line{height:2px;background:#fff;margin:26px 0}.counter{color:#aaa;font-size:12px;letter-spacing:2px;margin-bottom:18px}.card{border:2px solid #ff641c;min-height:290px;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:28px 20px;margin-bottom:22px;background:#14100e}.card h3{font-size:clamp(24px,7vw,35px);line-height:1.1;color:#ff641c;margin:0;font-weight:900}.card p{font-size:17px;line-height:1.55;margin:0}.card.empty h3{color:#fff}.btn{width:100%;padding:19px 12px;font-weight:900;letter-spacing:2px;font-size:16px;cursor:pointer;border:2px solid #ff641c;background:#ff641c;color:#080808;margin-bottom:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:transparent;color:#ff641c}.back{display:inline-block;color:#aaa;text-decoration:none;margin-top:18px;font-size:13px}footer{padding:15px;text-align:center;color:#777;font-size:10px;letter-spacing:2px}.hint{color:#aaa;font-size:12px;line-height:1.5;margin:10px 0 20px}@media(prefers-reduced-motion:no-preference){.card.reveal{animation:pop .25s ease-out}@keyframes pop{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:scale(1)}}}</style></head><body><main><h1>FEAR PONG</h1><div class="line"></div><h2>TEAM 1</h2><div class="counter" id="counter" aria-live="polite"></div><section class="card empty" id="card" aria-live="polite"><h3 id="name">YOUR FATE AWAITS</h3><p id="description">Draw a curse when one of your cursed cups is hit.</p></section><button class="btn" id="draw">DRAW CURSE</button><p class="hint">If a curse cannot be applied, draw again. Every drawn card stays discarded.</p><button class="btn secondary" id="reset">RESHUFFLE / RESET DECK</button><a class="back" href="../">← SELECT ANOTHER TEAM</a></main><footer>THE HAUNTING OF HIGH STREET</footer><script>
'use strict';
const curses=[["DEAD EYE", "Take your next shot with your eyes closed."], ["POSSESSION", "Your teammate must control your throwing arm for your next shot."], ["RESURRECTION", "Your opponents may restore one of their eliminated cups. If none have been eliminated, redraw."], ["DOUBLED FOR NOTHING", "If every player on your team misses their next shot, your opponents' next successful shot eliminates 2 cups instead of 1. You choose the second cup to sacrifice. This penalty expires after one opposing team's round."], ["NOWHERE TO HIDE", "Permanently reveal the position of one of your cursed cups to your opponents. If no cursed cups remain, redraw."], ["GHOST CUP", "Your opponents secretly add an empty Ghost Cup to their formation while your team closes their eyes. If you hit it, both the Ghost Cup and one of your cups are eliminated. If you only have 1 cup left, only the Ghost Cup is eliminated."], ["THE SUMMONING", "Your opponents choose a spectator to take a shot at your cups. If they hit, you lose 2 cups instead of 1. You choose the second cup."], ["THE PUMPKIN-JACK CROWN", "Everyone on your team must play Rock, Paper, Scissors simultaneously. The loser must wear the Pumpkin-Jack Crown (found under the table) for their next 3 shots. Replay any ties until there is one loser."]];
const key='fear-pong-v3-team-1';
const counter=document.getElementById('counter'),card=document.getElementById('card'),nameEl=document.getElementById('name'),desc=document.getElementById('description'),drawBtn=document.getElementById('draw');
function shuffle(){const a=curses.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fresh(){return {order:shuffle(),position:0,last:null};}
function valid(s){return s&&Array.isArray(s.order)&&s.order.length===curses.length&&new Set(s.order).size===curses.length&&s.order.every(x=>Number.isInteger(x)&&x>=0&&x<curses.length)&&Number.isInteger(s.position)&&s.position>=0&&s.position<=curses.length&&(s.last===null||(Number.isInteger(s.last)&&s.last>=0&&s.last<curses.length));}
let state;try{state=JSON.parse(localStorage.getItem(key));}catch(e){}if(!valid(state)){state=fresh();save();}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
function render(){const remaining=curses.length-state.position;counter.textContent=remaining+' OF '+curses.length+' CURSES REMAINING';drawBtn.disabled=remaining===0;drawBtn.textContent=remaining?'DRAW '+(state.position?'NEXT ':'')+'CURSE':'DECK EMPTY';card.classList.remove('reveal');void card.offsetWidth;card.classList.add('reveal');if(state.last!==null){const c=curses[state.last];nameEl.textContent=c[0];desc.textContent=c[1];card.classList.remove('empty');}else if(!remaining){nameEl.textContent='DECK EMPTY';desc.textContent='All eight curses have been drawn. Reset for a new game.';card.classList.add('empty');}else{nameEl.textContent='YOUR FATE AWAITS';desc.textContent='Draw a curse when one of your cursed cups is hit.';card.classList.add('empty');}}
drawBtn.addEventListener('click',()=>{if(state.position>=curses.length)return;state.last=state.order[state.position++];save();render();});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset this team’s deck? All 8 curses will be reshuffled.')){state=fresh();save();render();}});render();
</script></body></html>
