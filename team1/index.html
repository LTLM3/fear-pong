<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>FEAR PONG — TEAM 1</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}main{width:min(100%,540px);margin:auto;padding:35px 20px 50px;text-align:center}h1{font-size:clamp(48px,12vw,75px);font-weight:900;font-style:italic;letter-spacing:-3px;color:#ff641c;line-height:1;margin:0 0 12px}h2{font-size:17px;letter-spacing:4px;margin:0 0 25px}.line{height:2px;background:#fff;margin:26px 0}.counter{color:#aaa;font-size:12px;letter-spacing:2px;margin-bottom:18px}.card{position:relative;border:2px solid #ff641c;min-height:290px;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:48px 20px 28px;margin-bottom:22px;background:#14100e}.card h3{font-size:clamp(24px,7vw,35px);line-height:1.1;color:#ff641c;margin:0;font-weight:900}.card p{font-size:17px;line-height:1.55;margin:0}.round-reminder{position:absolute;top:11px;right:12px;left:12px;text-align:right;color:#929292;font-size:10px;line-height:1.35;letter-spacing:.25px;font-weight:600}.card.empty .round-reminder{display:none}.card.empty h3{color:#fff}.card.empty .curse-icon{display:none}.card.empty{align-items:center;justify-content:center;gap:12px}.card.empty h3,.card.empty p{text-align:center;width:100%}.curse-icon{width:72px;height:72px;margin:0 auto;color:#ff641c;display:block}.curse-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.read-aloud{color:#929292;font-size:12px;letter-spacing:1px;margin-top:0;font-weight:600}.card.empty .read-aloud{display:none}.card.mega{border-width:3px;background:#1b100c}.btn{width:100%;padding:19px 12px;font-weight:900;letter-spacing:2px;font-size:16px;cursor:pointer;border:2px solid #ff641c;background:#ff641c;color:#080808;margin-bottom:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:transparent;color:#ff641c}#mega-draw{border-style:dashed}.back{display:inline-block;color:#aaa;text-decoration:none;margin-top:18px;font-size:13px}footer{padding:15px;text-align:center;color:#777;font-size:10px;letter-spacing:2px}.hint{color:#aaa;font-size:12px;line-height:1.5;margin:10px 0 20px}@media(prefers-reduced-motion:no-preference){.card.reveal{animation:pop .25s ease-out}@keyframes pop{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:scale(1)}}}</style></head><body><main><h1>FEAR PONG</h1><div class="line"></div><h2>TEAM 1</h2><div class="counter" id="counter" aria-live="polite"></div><section class="card empty" id="card" aria-live="polite"><div class="round-reminder">[Draw curses at the end of each round]</div><div class="curse-icon" id="curse-icon" aria-hidden="true"></div><h3 id="name">YOUR FATE AWAITS</h3><p id="description">Only draw a curse at the end of the round.</p><div class="read-aloud" id="read-aloud">[Read out loud]</div></section><button class="btn" id="draw">DRAW CURSE</button><button class="btn secondary" id="mega-draw">☠ MEGA CURSE DRAW</button><p class="hint">If a curse cannot be applied, draw again. Every drawn card stays discarded.</p><button class="btn secondary" id="reset">RESHUFFLE / RESET DECK</button><a class="back" href="../">← SELECT ANOTHER TEAM</a></main><footer>THE HAUNTING OF HIGH STREET</footer><script>
'use strict';
const curses=[
["DEAD EYE","Every player on your team must take their next shot with their eyes closed."],
["POSSESSION","Your teammate must control your throwing arm for your next shot."],
["RESURRECTION","Your opponents may restore one of their eliminated cups. If none have been eliminated, redraw."],
["DOUBLED FOR NOTHING","If every player on your team misses their next shot, your opponents' next successful shot eliminates 2 cups instead of 1. You choose the second cup to sacrifice. This penalty expires after one opposing team's round."],
["NOWHERE TO HIDE","Permanently reveal the position of one of your cursed cups to your opponents. If no cursed cups remain, redraw."],
["THE SUMMONING","Your opponents choose a spectator to take a bonus shot at your cups - this activates immediately. If the spectator hits, you lose 2 cups instead of 1. You choose the second cup to sacrifice."],
["THE PUMPKIN-JACK CROWN","Everyone on your team must play Rock, Paper, Scissors simultaneously. The loser must wear the Pumpkin-Jack Crown (found under the table) for their next 3 shots. Replay any ties until there is one loser."],
["GRAVE ROBBER","If your opponents hit a shot next round, one of your eliminated cups is added to their formation and filled with their drink. The stolen cup then counts as a normal cup."]
];
const megaCurses=[
["HALFWAY TO HELL","Your opponents may move up to 3 of your remaining cups towards their side, placing them in the centre of the table in any formation. These cups remain there until eliminated."],
["THE REAPER'S GAMBLE","Your opponents nominate one of your remaining cups. They get one bonus shot at it. If they hit, you lose 3 additional cups. If they miss, you may resurrect 1 of your eliminated cups."]
];

const iconPaths=['<circle cx="12" cy="12" r="9"/><path d="M4 4l16 16M12 7v10M7 12h10"/>', '<path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/><circle cx="12" cy="12" r="3"/>', '<path d="M4 11a8 8 0 1 1 3 7M4 17v-6h6"/><path d="M12 7v10M7 12h10"/>', '<circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/><path d="M3 4l18 16"/>', '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3"/>', '<path d="M12 3v7M8 6l4-3 4 3M6 13a6 6 0 0 0 12 0"/><path d="M4 19h16M8 22h8"/>', '<path d="M3 9l4 4 5-8 5 8 4-4-2 11H5L3 9Z"/><circle cx="12" cy="16" r="1"/>', '<path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/><path d="M14 4h6v6M10 20H4v-6"/>', '<path d="M4 4l16 16M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z"/><path d="M3 21h18"/>', '<path d="M12 2 4 6v6c0 5 3 8 8 10 5-2 8-5 8-10V6l-8-4Z"/><path d="M8 11h8M12 7v8"/>'];
const iconEl=document.getElementById('curse-icon');
function showIcon(index){iconEl.innerHTML=index===null?'':`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${iconPaths[index]}</svg>`;}
const key='fear-pong-v4-team-1';
const counter=document.getElementById('counter'),card=document.getElementById('card'),nameEl=document.getElementById('name'),desc=document.getElementById('description'),drawBtn=document.getElementById('draw');
function shuffle(){const a=curses.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fresh(){return {order:shuffle(),position:0,last:null,mega:null};}
function valid(s){return s&&Array.isArray(s.order)&&s.order.length===curses.length&&new Set(s.order).size===curses.length&&s.order.every(x=>Number.isInteger(x)&&x>=0&&x<curses.length)&&Number.isInteger(s.position)&&s.position>=0&&s.position<=curses.length&&(s.last===null||(Number.isInteger(s.last)&&s.last>=0&&s.last<curses.length));}
let state;try{state=JSON.parse(localStorage.getItem(key));}catch(e){}if(!valid(state)){state=fresh();save();}if(state.mega===undefined)state.mega=null;
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
function render(){const remaining=curses.length-state.position;counter.textContent=remaining+' OF '+curses.length+' CURSES REMAINING';drawBtn.disabled=remaining===0;drawBtn.textContent=remaining?'DRAW '+(state.position?'NEXT ':'')+'CURSE':'DECK EMPTY';card.classList.remove('reveal');void card.offsetWidth;card.classList.add('reveal');card.classList.toggle('mega',state.mega!==null);showIcon(state.mega!==null?8+state.mega:state.last);if(state.mega!==null){const c=megaCurses[state.mega];nameEl.textContent=c[0];desc.textContent=c[1];card.classList.remove('empty');}else if(state.last!==null){const c=curses[state.last];nameEl.textContent=c[0];desc.textContent=c[1];card.classList.remove('empty');}else if(!remaining){nameEl.textContent='DECK EMPTY';desc.textContent='All eight curses have been drawn. Reset for a new game.';card.classList.add('empty');}else{nameEl.textContent='YOUR FATE AWAITS';desc.textContent='Only draw a curse at the end of the round.';card.classList.add('empty');}}
drawBtn.addEventListener('click',()=>{if(state.position>=curses.length)return;state.last=state.order[state.position++];state.mega=null;save();render();});
document.getElementById('mega-draw').addEventListener('click',()=>{state.mega=Math.floor(Math.random()*megaCurses.length);save();render();});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset this team’s deck? All 8 regular curses will be reshuffled and the Mega Curse display cleared.')){state=fresh();save();render();}});render();
</script></body></html>
