<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080808"><title>FEAR PONG — TEAM 2</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}main{width:min(100%,550px);margin:auto;padding:42px 22px;text-align:center}h1{font-size:clamp(56px,13vw,88px);font-weight:900;font-style:italic;letter-spacing:-4px;line-height:.94;color:#ff641c;margin:0}h2{letter-spacing:4px;font-size:16px;margin:22px 0 14px}.rule{height:2px;background:white;margin:27px 0}.panel{border:2px solid #ff641c;padding:30px 18px;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:16px}.eyebrow{color:#ff641c;font-weight:800;letter-spacing:3px;font-size:12px}.curse{font-size:clamp(24px,7vw,36px);font-weight:900;line-height:1.08;margin:0}.description{font-size:17px;line-height:1.5;margin:0}.muted{color:#aaa}.actions{display:grid;gap:12px;margin-top:20px}button{font:900 18px Arial,sans-serif;letter-spacing:2px;padding:20px 12px;cursor:pointer;border:2px solid #ff641c;background:#ff641c;color:#080808}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:transparent;color:#ff641c;font-size:13px;padding:15px}a{color:#bbb;font-size:12px;letter-spacing:2px;text-decoration:none}footer{text-align:center;color:#777;font-size:10px;letter-spacing:3px;padding:18px}#count{font-size:13px;color:#aaa;margin-top:18px}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:4px}</style></head><body><main><h1>FEAR<br>PONG</h1><h2>TEAM 2</h2><div class="rule"></div><section class="panel" aria-live="polite"><div class="eyebrow" id="status">YOUR CURSE DECK</div><h3 class="curse" id="name">8 CURSES AWAIT</h3><p class="description muted" id="description">Draw a card when one of your cursed cups is hit. Every card can only be drawn once.</p></section><div class="actions"><button id="draw">DRAW CURSE</button><button class="secondary" id="reset">RESHUFFLE / RESET DECK</button></div><div id="count" aria-live="polite"></div><p style="margin-top:28px"><a href="../">← SELECT ANOTHER TEAM</a></p></main><footer>THE HAUNTING OF HIGH STREET</footer><script>
const CURSES=[["DEAD EYE", "Take your next shot with your eyes closed."], ["POSSESSION", "Your teammate must control your throwing arm for your next shot."], ["RESURRECTION", "Your opponents may restore one of their eliminated cups. If none have been eliminated, redraw."], ["DOUBLE OR NOTHING", "If you miss your next shot and your opponents hit their next shot, you lose 2 cups instead of 1. You choose which 2nd cup is sacrificed."], ["NOWHERE TO HIDE", "Permanently reveal the position of one of your cursed cups to your opponents. If no cursed cups remain, redraw."], ["GHOST CUP", "Your opponents secretly add an empty Ghost Cup to their formation while your team closes their eyes. If you hit it, both the Ghost Cup and one of your cups are eliminated. If you only have 1 cup left, only the Ghost Cup is eliminated."], ["THE SUMMONING", "Your opponents choose a spectator to take a shot at your cups. If they hit, you lose 2 cups instead of 1. You choose the second cup."], ["THE PUMPKIN-JACK CROWN", "Play Rock, Paper, Scissors against your teammate. The loser must wear the Pumpkin-Jack Crown (found under the table) for their next 3 shots."]];
const STORAGE_KEY='fear-pong-team-2-v3';
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function fresh(){return {order:shuffle(CURSES.map((_,i)=>i)),drawn:0};}
function valid(s){return s&&Array.isArray(s.order)&&s.order.length===CURSES.length&&new Set(s.order).size===CURSES.length&&s.order.every(i=>Number.isInteger(i)&&i>=0&&i<CURSES.length)&&Number.isInteger(s.drawn)&&s.drawn>=0&&s.drawn<=CURSES.length;}
let state;try{state=JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){}if(!valid(state))state=fresh();
const nameEl=document.getElementById('name'),descEl=document.getElementById('description'),statusEl=document.getElementById('status'),drawBtn=document.getElementById('draw'),countEl=document.getElementById('count');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function render(){let n=state.drawn;countEl.textContent=`${CURSES.length-n} OF ${CURSES.length} CURSES REMAINING`;drawBtn.disabled=n>=CURSES.length;if(n===0){statusEl.textContent='YOUR CURSE DECK';nameEl.textContent='8 CURSES AWAIT';descEl.textContent='Draw a card when one of your cursed cups is hit. Every card can only be drawn once.';descEl.classList.add('muted');}else{let c=CURSES[state.order[n-1]];statusEl.textContent=n===CURSES.length?'FINAL CURSE DRAWN':'CURSE REVEALED';nameEl.textContent=c[0];descEl.textContent=c[1];descEl.classList.remove('muted');}if(n===CURSES.length)drawBtn.textContent='DECK EMPTY';else drawBtn.textContent=n?'DRAW NEXT CURSE':'DRAW CURSE';}
drawBtn.addEventListener('click',()=>{if(state.drawn<CURSES.length){state.drawn++;save();render();}});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset and reshuffle all 8 curses for Team 2?')){state=fresh();save();render();}});
save();render();
</script></body></html>
