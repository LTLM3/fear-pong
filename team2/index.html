<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>FEAR PONG — TEAM 2</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#080808;color:white;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}main{width:min(100%,510px);margin:auto;padding:30px 22px 24px;text-align:center}a{color:#aaa;text-decoration:none;font-size:12px;letter-spacing:2px}h1{font-size:clamp(55px,13vw,86px);line-height:.92;font-style:italic;letter-spacing:-4px;color:#ff641c;margin:26px 0 12px;font-weight:900}.rule{height:2px;background:white;margin:25px 0}h2{font-size:16px;letter-spacing:5px;margin:20px 0}.sub{color:#999;font-size:12px;letter-spacing:2px;margin:12px 0 25px}.card{height:285px;border:2px solid #ff641c;background:radial-gradient(circle at center,#24130c,#090909 72%);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px;position:relative;overflow:hidden}.card:before,.card:after{content:'✦';position:absolute;color:#803917;font-size:25px;top:12px;left:16px}.card:after{top:auto;left:auto;bottom:12px;right:16px}.sigil{font-size:65px;line-height:1;margin:0 0 18px;filter:grayscale(1) brightness(1.5)}.name{color:#ff641c;font-size:25px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.desc{color:#e6e6e6;font-size:15px;line-height:1.55;margin-top:15px;max-width:370px}.back{font-size:90px;color:#ff641c;line-height:1}.backtext{font-size:13px;letter-spacing:4px;color:#bbb;margin-top:24px}.hidden{display:none!important}.reveal{animation:reveal .45s ease-out}@keyframes reveal{from{transform:scale(.93);opacity:.25;filter:blur(6px)}to{transform:scale(1);opacity:1;filter:blur(0)}}button{width:100%;background:#ff641c;border:2px solid #ff641c;color:#080808;padding:19px;font-size:19px;font-weight:900;letter-spacing:2px;margin-top:16px;cursor:pointer}button.secondary{background:transparent;color:#ff641c;font-size:12px;padding:13px}button:disabled{opacity:.4;cursor:not-allowed}.status{font-size:12px;color:#aaa;letter-spacing:1px;margin-top:16px;line-height:1.6}.counter{color:#ff641c}.controls{margin-top:10px}.footer{margin-top:30px;color:#777;font-size:10px;letter-spacing:3px}label{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#ddd;margin:18px 0}input{width:18px;height:18px;accent-color:#ff641c}.notice{font-size:12px;color:#aaa;line-height:1.5;margin-top:15px}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}</style></head><body><main><a href="../">← BACK TO TEAM SELECTION</a><h1>FEAR<br>PONG</h1><div class="rule"></div><h2>TEAM 2</h2><p class="sub">YOUR CURSE DECK</p><div class="card" id="card" aria-live="polite"><div id="face"><div class="back">⛧</div><div class="backtext">THE DECK AWAITS</div></div></div><div class="status" id="status"></div><div class="controls"><button id="draw">DRAW CURSE</button><button class="secondary" id="reset">RESHUFFLE / RESET DECK</button></div><p class="notice">Each curse can be drawn only once. If a curse cannot be used, draw again; it stays discarded. Use one phone per team.</p><div class="footer">THE HAUNTING OF HIGH STREET</div></main><script>
const TEAM='2';const KEY='fear-pong-team-'+TEAM+'-v2';
const CURSES=[
{id:'dead-eye',icon:'◉',name:'Dead Eye',desc:'Take your next shot blindfolded.'},
{id:'possession',icon:'☠',name:'Possession',desc:'Your teammate controls your shooting arm for your next shot.'},
{id:'resurrection',icon:'✝',name:'Resurrection',desc:'Your opponents restore one of their eliminated cups.'},
{id:'double-or-nothing',icon:'⚄',name:'Double or Nothing',desc:'If you miss your next shot and your opponent hits theirs, your team loses two cups.'},
{id:'nowhere-to-hide',icon:'◈',name:'Nowhere to Hide',desc:'Reveal the position of one of your remaining cursed cups to the opposing team.'},
{id:'ghost-cup',icon:'♟',name:'Ghost Cup',desc:'Your opponents add a dummy cup to their formation. Hitting it counts as a miss.'},
{id:'guest-curse',icon:'✋',name:'Guest Curse',desc:'A random guest chooses who takes your team’s next shot.'}
];
const card=document.getElementById('card'),face=document.getElementById('face'),status=document.getElementById('status'),draw=document.getElementById('draw');
function shuffled(){const a=CURSES.map(c=>c.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {remaining:shuffled(),drawn:[],current:null}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.remaining)||!Array.isArray(state.drawn))state=fresh();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){const current=CURSES.find(c=>c.id===state.current);if(current){face.innerHTML='<div class="sigil">'+current.icon+'</div><div class="name">'+current.name+'</div><div class="desc">'+current.desc+'</div>'}else{face.innerHTML='<div class="back">⛧</div><div class="backtext">THE DECK AWAITS</div>'}draw.disabled=state.remaining.length===0;draw.textContent=state.remaining.length?'DRAW CURSE':'DECK EMPTY';status.innerHTML='<span class="counter">'+state.drawn.length+' DRAWN</span> · '+state.remaining.length+' REMAINING'}
draw.addEventListener('click',()=>{if(!state.remaining.length)return;state.current=state.remaining.shift();state.drawn.push(state.current);save();card.classList.remove('reveal');void card.offsetWidth;card.classList.add('reveal');render()});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset and reshuffle Team '+TEAM+'’s entire deck?')){state=fresh();save();render()}});render();
</script></body></html>
