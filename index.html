<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>FEAR PONG</title>
  <style>
    :root { color-scheme: dark; --orange:#ff5a24; --black:#101010; --white:#f7f7f7; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--black); color:var(--white); font-family:Arial,Helvetica,sans-serif; display:flex; flex-direction:column; }
    main { width:min(92%,560px); margin:auto; text-align:center; padding:70px 0; }
    h1 { color:var(--orange); font-size:clamp(3.3rem,12vw,6rem); font-weight:900; font-style:italic; letter-spacing:-.055em; margin:0 0 25px; line-height:1; }
    .rule { width:80%; height:5px; background:var(--white); margin:0 auto 54px; }
    h2 { font-size:1.15rem; letter-spacing:.18em; font-weight:800; margin:0 0 26px; }
    .teams { display:grid; gap:18px; }
    .team { display:block; border:3px solid var(--orange); color:var(--orange); text-decoration:none; padding:23px 12px; font-size:1.5rem; font-weight:900; font-style:italic; transition:background .2s,color .2s; }
    .team:hover,.team:focus-visible { background:var(--orange); color:var(--black); }
    footer { text-align:center; padding:24px 12px 32px; font-size:.72rem; letter-spacing:.2em; color:#666; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>FEAR PONG</h1>
    <div class="rule" aria-hidden="true"></div>
    <h2>SELECT YOUR TEAM</h2>
    <nav class="teams" aria-label="Choose your team">
      <a class="team" href="team1/">TEAM ONE</a>
      <a class="team" href="team2/">TEAM TWO</a>
    </nav>
  </main>
  <footer>THE HAUNTING OF HIGH STREET</footer>
</body>
</html>
