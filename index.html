
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FEAR PONG</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 90px 24px 40px;
      text-align: center;
      flex: 1;
    }

    h1 {
      margin: 0;
      color: #ff641c;
      font-size: clamp(64px, 15vw, 100px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -5px;
      line-height: 0.95;
    }

    .divider {
      height: 2px;
      background: #fff;
      margin: 42px 0;
    }

    h2 {
      font-size: 18px;
      letter-spacing: 5px;
      margin-bottom: 30px;
    }

    .team {
      display: block;
      padding: 23px;
      margin: 16px 0;
      border: 2px solid #ff641c;
      color: #ff641c;
      text-decoration: none;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 3px;
      transition: 0.2s;
    }

    .team:hover, .team:active {
      background: #ff641c;
      color: #080808;
    }

    footer {
      padding: 30px 16px;
      color: #777;
      font-size: 11px;
      letter-spacing: 3px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>FEAR<br>PONG</h1>
    <div class="divider"></div>

    <h2>SELECT YOUR TEAM</h2>

    <a class="team" href="team1/">TEAM ONE</a>
    <a class="team" href="team2/">TEAM TWO</a>
  </main>

  <footer>THE HAUNTING OF HIGH STREET</footer>
</body>
</html>
